name: ci

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # No packages.lock.json: PublishAot makes the SDK add ILCompiler/ILLink packages pinned to its own
      # runtime patch, which would tie a lock file to one exact SDK. All package versions are exact in the csproj.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj', 'engine/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RateBd.slnx

      - name: Build
        run: dotnet build RateBd.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution RateBd.slnx -c Release --no-build

      - name: Native AOT publish (linux-x64)
        run: dotnet publish src/RateBd.Engine/RateBd.Engine.csproj -c Release -r linux-x64 -o publish

      - name: Smoke-test the native binary against the Bangladesh Bank fixture
        run: |
          # Runs only the MidMarket provider so no live provider is called; proves the AOT-trimmed
          # AngleSharp and JSON paths work in the published binary.
          mkdir -p "$RUNNER_TEMP/smoke"
          RATEBD_Engine__DataDirectory="$RUNNER_TEMP/smoke" \
          RATEBD_Engine__FailWhenNothingFetched=false \
          RATEBD_Providers__MidMarket__BangladeshBankHtmlPath="$PWD/tests/RateBd.Engine.Tests/Fixtures/bangladesh-bank-exchangerate.html" \
          RATEBD_Engine__OnlyProviders__0=MidMarket \
            ./publish/ratebd-engine
          grep -q '"usdBdt": 123.4500' "$RUNNER_TEMP/smoke/gbp-bdt.json"
          echo "Native binary size: $(du -h publish/ratebd-engine | cut -f1)"
