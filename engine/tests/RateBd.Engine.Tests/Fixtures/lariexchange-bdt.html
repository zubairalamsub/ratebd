    <script>
        function calculateYouGet() {
            if (document.getElementById('MainContent_txtAmount').value != "" && document.getElementById('MainContent_txtExchangeRate').value != "0") {
                document.getElementById('MainContent_txtYouGet').value = (document.getElementById('MainContent_txtAmount').value / document.getElementById('MainContent_txtExchangeRate').value).toFixed(document.getElementById('MainContent_varDecimalPlaces').value);
            }
            else {
                document.getElementById('MainContent_txtYouGet').value = "";
            }
        }
        function calculateAmount() {
            if (document.getElementById('MainContent_txtYouGet').value != "" && document.getElementById('MainContent_txtExchangeRate').value != "0") {
                document.getElementById('MainContent_txtAmount').value = (document.getElementById('MainContent_txtYouGet').value * document.getElementById('MainContent_txtExchangeRate').value).toFixed(document.getElementById('MainContent_varDecimalPlaces').value);
            }
            else {
                document.getElementById('MainContent_txtAmount').value = "";
            }
        }
